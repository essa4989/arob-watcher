services:
  postgres:
    image: postgres:16-alpine
    container_name: arob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arob
      POSTGRES_PASSWORD: arob_dev_password
      POSTGRES_DB: arob_watcher
    ports:
      - "5432:5432"
    volumes:
      - arob_pg_data:/var/lib/postgresql/data

volumes:
  arob_pg_data:
